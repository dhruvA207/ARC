<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARC</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

  <div id="shell" class="shell">

    <p id="status" class="status"></p>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
