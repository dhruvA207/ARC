[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc"
version = "0.1.0"
description = "ARC — a cool AI assistant."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Dhruv Agrawal" }]

# Every dependency here must be Apache-2.0 or MIT (docs/BRIEF.md §0.1).
# Each one also gets a row in docs/DEPENDENCIES.md explaining why it earns its place.
dependencies = [
    "PyYAML>=6.0",  # MIT
]

[project.optional-dependencies]
# Inference backends are optional so the core install stays at one dependency.
# The router imports these lazily and reports a clear error when one is absent.
mlx = [
    "mlx-lm>=0.26",        # MIT — Apple Silicon only
    "huggingface-hub>=0.23",  # Apache-2.0 — weight downloads
]
llamacpp = [
    "llama-cpp-python>=0.3",  # MIT — portable GGUF: CPU/Metal/CUDA
    "huggingface-hub>=0.23",  # Apache-2.0
]
# Speech in and out. Apple's frameworks rather than Whisper: mlx-whisper is MIT itself
# but pulls torch/scipy/numba/numpy (BSD-2, BSD-3, BSL-1.0) and tqdm (MPL-2.0), which
# breaks the Apache-2.0/MIT rule in §0.1 — and ~3 GB against an 11.5 GB budget.
voice = [
    "pyobjc-framework-Speech>=10",        # MIT — SFSpeechRecognizer, on-device
    "pyobjc-framework-AVFoundation>=10",  # MIT — AVAudioEngine input tap
    "google-genai>=1.0",                  # Apache-2.0 — the Gemini live session
    "sounddevice>=0.5",                   # MIT — audio in and out for that session
]
# The app window. WebKit rendering an ARC-owned NSWindow, rather than a browser tab or
# a browser-embedding library that would bring its own dependency tree (§7).
app = [
    "pyobjc-framework-WebKit>=10",  # MIT — WKWebView in an NSWindow
]
# Hand-gesture control of windows and the cursor. Heavy (~500 MB with its transitive
# numpy/opencv), which is exactly why it is opt-in rather than a core dependency —
# nothing else in ARC needs a camera pipeline.
camera = [
    "mediapipe>=0.10",                     # Apache-2.0 — hand landmarks + gesture model
    "opencv-python>=4.10",                 # Apache-2.0 — capture and the preview window
    "pyobjc-framework-AVFoundation>=10",   # MIT — identify cameras by name, not index
    "pyobjc-framework-ApplicationServices>=10",  # MIT — move/resize windows via AX
]
# Memory: vector search and the embedder. Optional for the same reason the backends are
# — `arc doctor`, `arc model list` and the kill switch must work on a machine that has
# never embedded anything — but anything that stores or recalls a memory needs these.
# Both imports are lazy and report a clear error when absent.
memory = [
    "sqlite-vec>=0.1",    # MIT/Apache-2.0 — vector search inside SQLite, no server (ADR-013)
    "onnxruntime>=1.17",  # MIT — bge-small without dragging in PyTorch (ADR-014)
    "tokenizers>=0.20",   # Apache-2.0 — the embedder's tokenizer
]
# Screen reading, OCR, and input control. Split from `camera` because they are what ARC
# uses to see and drive *this* machine, with no camera involved. Every import is lazy, so
# the core still imports on a machine with no Apple frameworks — asserted in the suite.
screen = [
    "pyobjc-core>=10",                           # MIT — objc runtime bridge
    "pyobjc-framework-Quartz>=10",               # MIT — capture, window list, event taps
    "pyobjc-framework-Cocoa>=10",                # MIT — AppKit and Foundation
    "pyobjc-framework-ApplicationServices>=10",  # MIT — the accessibility tree
    "pyobjc-framework-Vision>=10",               # MIT — OCR
]
dev = [
    "pytest>=8.0",   # MIT
    "ruff>=0.6",     # MIT
    "mypy>=1.11",    # MIT
    "types-PyYAML",  # Apache-2.0
]
# What this machine actually runs. Kept as one name so that setting up, or catching up
# after a `git pull`, is always `pip install -e '.[all]'` rather than a list to remember
# — and so adding a dependency here is enough to make it arrive on the other Mac.
# `llamacpp` is deliberately excluded: MLX is the backend on Apple Silicon, and building
# llama-cpp-python is slow enough to be worth opting into by hand.
all = ["arc[mlx,voice,app,memory,screen,camera,dev]"]

[project.scripts]
arc = "arc.__main__:main"
# Separate entry point on purpose (BRIEF §0.3). The kill switch is for when ARC has
# wedged the machine, so it must not depend on config loading, the hardware probe, or
# subcommand dispatch working. `arc kill` remains as an alias for when things are fine.
arc-kill = "arc.audit.killswitch:main"

[tool.setuptools.packages.find]
include = ["arc*"]

# The web UI is hand-written HTML/CSS/ES modules with no build step, so it ships as
# package data. Without this it is missing from an installed ARC and `arc serve`
# returns 404 for the UI while working fine from a source checkout.
[tool.setuptools.package-data]
arc = ["interface/webui/*.html", "interface/webui/*.css", "interface/webui/*.js"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]  # Any is legitimate in the config/JSON boundary layers.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # Test functions do not need return annotations to be readable.
# Cocoa selectors are camelCase by mandate — drawRect_ and isOpaque are the names
# AppKit calls, and renaming them means they are simply never invoked.
"arc/control/overlay.py" = ["N802"]
# Same mandate on the audio side: AVFoundation and Speech are framework names, and
# `import AVFoundation as av` would be a rename of Apple's own module.
"arc/voice/macos.py" = ["N806", "N814"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Platform stubs deliberately raise NotImplementedError; that is not dead code.
disallow_untyped_defs = true

# Optional inference backends ship no type stubs, and two of the three cannot even be
# installed on a given machine (MLX is Apple-Silicon-only). Ignoring them here keeps
# --strict meaningful for our own code instead of failing on third-party gaps.
[[tool.mypy.overrides]]
module = [
    "mlx.*", "mlx_lm.*", "llama_cpp.*", "huggingface_hub.*",
    "sqlite_vec.*", "onnxruntime.*", "tokenizers.*",
    "Quartz.*", "AppKit.*", "objc.*", "ApplicationServices.*",
    "Vision.*", "Foundation.*", "Speech.*", "AVFoundation.*", "WebKit.*",
    "sounddevice.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
